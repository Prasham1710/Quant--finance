[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfin"
version = "0.1.0"
description = "Quant finance projects implemented from first principles: portfolio optimization, pricing, risk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4", "scikit-learn>=1.3", "ruff>=0.5"]

[project.scripts]
quantfin-portfolio = "quantfin.portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning:quantfin.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
